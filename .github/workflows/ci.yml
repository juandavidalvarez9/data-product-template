name: CI

on:
  pull_request:
  push:
    branches: [main]

# The checks only read the repository.
permissions:
  contents: read

# A new push to the same branch stops the run of the previous push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      # Let every combination finish, so one failure does not hide another.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    steps:
      # Actions are pinned to a full commit. Dependabot keeps them up to date.
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python ${{ matrix.python }}
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install the pinned dependencies
        run: uv sync --locked

      - name: Run every check
        run: uv run poe check
