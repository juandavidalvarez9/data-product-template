[project]
name = "data-product"
version = "0.1.0"
description = "Starting point for small, tested data products."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Juan David Alvarez Gamez" }]
dependencies = [
    "duckdb>=2.0.1",
]

[project.scripts]
data-product = "data_product.cli:main"

[dependency-groups]
dev = [
    "coverage>=7.17.4",
    "mypy>=2.4.1",
    "poethepoet>=0.49.0",
    "pytest>=9.0",
    "ruff>=0.17.6",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes: unused names, undefined names
    "I",   # import order
    "B",   # likely bugs
    "UP",  # outdated syntax
    "SIM", # code that can be simpler
    "C4",  # comprehensions
    "PTH", # pathlib instead of os.path
    "RUF", # ruff's own rules
]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]
warn_unreachable = true

[tool.coverage.run]
branch = true
source_pkgs = ["data_product"]
# Some tests start a new Python process; measure that process too.
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 90
show_missing = true

# One definition of every check. People and CI run the same commands:
# `uv run poe check` runs all of them.
[tool.poe.executor]
# Run each task in the environment poe was started from. Without this, poe
# starts `uv run` again for every task and ignores `uv run --python`.
type = "simple"

[tool.poe.tasks.format]
help = "Rewrite the code in the standard format"
cmd = "ruff format ."

[tool.poe.tasks.format-check]
help = "Fail if any file is not in the standard format"
cmd = "ruff format --check ."

[tool.poe.tasks.lint]
help = "Look for likely mistakes"
cmd = "ruff check ."

[tool.poe.tasks.types]
help = "Check the type annotations"
cmd = "mypy"

[tool.poe.tasks.test]
help = "Run the tests and fail if coverage is under 90%"
sequence = [
    "coverage erase",
    "coverage run -m pytest",
    "coverage combine",
    "coverage report",
]
default_item_type = "cmd"

[tool.poe.tasks.bench]
help = "Measure time and peak memory at 1x and 10x, and rewrite docs/benchmarks.md"
cmd = "python scripts/benchmark.py"

[tool.poe.tasks.check]
help = "Run every check, as CI does"
sequence = ["format-check", "lint", "types", "test"]
